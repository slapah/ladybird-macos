name: Build Ladybird (macOS arm64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'LadybirdBrowser/ladybird ref to build'
        required: false
        default: 'master'
      make_release:
        description: 'Publish result as a GitHub release'
        type: boolean
        required: false
        default: true
      lto:
        description: 'Enable thin-LTO (broken upstream on macOS since ladybird@c8da2a1bb5; upstream nightly fails the same way)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Upstream CI builds the macOS Distribution preset on macOS 26 + Xcode 26.
    runs-on: macos-26
    timeout-minutes: 350

    env:
      LADYBIRD_SOURCE_DIR: ${{ github.workspace }}/ladybird
      LADYBIRD_MAIN_SOURCE_DIR: ${{ github.workspace }}/ladybird
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: '%compiler% -v'
      # Upstream now keeps one vcpkg checkout per preset (Build/vcpkg-distribution);
      # Meta/CMake/environment.cmake derives it from LADYBIRD_VCPKG_TYPE, so VCPKG_ROOT
      # must stay unset.

    steps:
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref || 'master' }}
          path: ladybird

      - name: Record source commit
        id: src
        working-directory: ladybird
        run: |
          echo "sha=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyyaml requests six cryptography

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install autoconf autoconf-archive automake bash ccache coreutils libtool nasm ninja pkg-config unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Rust toolchain
        working-directory: ladybird
        run: |
          if rustup toolchain install; then
            exit 0
          fi
          # Runner images occasionally ship a half-installed toolchain rustup cannot repair.
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "Reinstalling Rust toolchain ${CHANNEL} from scratch"
          rustup toolchain uninstall "${CHANNEL}" || rm -rf "$(rustup show home)/toolchains/${CHANNEL}"-*
          rustup toolchain install

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos26-arm64-dist-${{ steps.src.outputs.sha }}
          restore-keys: |
            ccache-macos26-arm64-dist-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ladybird/Build/caches/vcpkg-binary-cache
          key: vcpkg-macos26-arm64-dist-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/Meta/CMake/vcpkg/**') }}
          restore-keys: |
            vcpkg-macos26-arm64-dist-

      - name: Install vcpkg
        working-directory: ladybird
        # Meta/Utils/build_vcpkg.py is a library now; ladybird.py is the entrypoint.
        run: python3 ./Meta/ladybird.py vcpkg --preset Distribution

      - name: Configure
        working-directory: ladybird
        run: |
          # ENABLE_LTO_FOR_RELEASE defaults ON for the Distribution preset. With thin-LTO the C++
          # ladybird_alloc/ladybird_dealloc/... symbols (AK/FFIHelpers.cpp) only exist as bitcode,
          # so ld64 can't resolve them from the non-LTO Rust staticlib ("symbol(s) defined in LTO
          # objects are referenced but missing in compiled objects"). Off until upstream fixes it.
          cmake --preset Distribution \
            -DENABLE_LTO_FOR_RELEASE=${{ inputs.lto && 'ON' || 'OFF' }} \
            -DCMAKE_C_COMPILER="$(xcrun --find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)" \
            -DPython3_EXECUTABLE="${pythonLocation}/bin/python"

      - name: Build
        working-directory: ladybird
        run: cmake --build Build/distribution

      - name: ccache stats
        run: ccache -s || true

      - name: Package app bundle
        id: pkg
        working-directory: ladybird
        run: |
          APP=$(find Build/distribution -maxdepth 3 -name 'Ladybird.app' -type d | head -n1)
          if [ -z "$APP" ]; then
            echo "Ladybird.app not found; Build/distribution/bin contents:" >&2
            ls -la Build/distribution/bin >&2 || true
            exit 1
          fi
          NAME="Ladybird-macOS-arm64-${{ steps.src.outputs.date }}-${{ steps.src.outputs.sha }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${GITHUB_WORKSPACE}/${NAME}.zip"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.zip

      - name: Publish release
        if: ${{ inputs.make_release != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.src.outputs.date }}-${{ steps.src.outputs.sha }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Ladybird macOS arm64 ${TAG}" \
            --notes "Unsigned build of LadybirdBrowser/ladybird@${{ steps.src.outputs.sha }} (Distribution preset — static, self-contained; AppKit UI; built on macOS 26 / Xcode 26; LTO=${{ inputs.lto && 'on' || 'off' }}). After downloading: \`xattr -dr com.apple.quarantine Ladybird.app\`" \
            "${{ steps.pkg.outputs.name }}.zip" || \
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "${{ steps.pkg.outputs.name }}.zip"
